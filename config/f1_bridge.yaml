# ros_gz_bridge config: lets ROS 2 send detach / attach commands to the F1 car.
# Use from ROS 2 with e.g.:
#   ros2 topic pub --once /f1/bolt_fl/detach std_msgs/msg/Empty {}
#   ros2 topic pub --once /f1/bolt_fl/attach std_msgs/msg/Empty {}

- ros_topic_name: "/f1/wheel_fl/detach"
  gz_topic_name: "/f1/wheel_fl/detach"
  ros_type_name: "std_msgs/msg/Empty"
  gz_type_name: "gz.msgs.Empty"
  direction: ROS_TO_GZ
- ros_topic_name: "/f1/wheel_fl/attach"
  gz_topic_name: "/f1/wheel_fl/attach"
  ros_type_name: "std_msgs/msg/Empty"
  gz_type_name: "gz.msgs.Empty"
  direction: ROS_TO_GZ

